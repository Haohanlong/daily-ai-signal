name: 每日自动更新AI资讯

on:
  schedule:
    # UTC 0点 = 北京时间早上8点。cron五个字段: 分 时 日 月 星期
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # 允许在GitHub网页上手动点一下立刻触发,不用等定时

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 写入密钥(不会被提交到仓库,只在这次运行里临时存在)
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: 跑完整pipeline
        run: |
          python3 fetch_sources.py
          python3 summarize.py
          python3 classify.py

      - name: 如果有新数据,提交并推送(没有变化就跳过,不产生空提交)
        run: |
          git config user.name "daily-ai-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data.json summarized_news.json summary_cache.json classify_cache.json
          git diff --staged --quiet || git commit -m "自动更新: $(date -u +'%Y-%m-%d')"
          git push
